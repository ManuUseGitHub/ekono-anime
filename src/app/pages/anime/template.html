<div class="flex p-3">
  <main class="flex-1">
    <app-paginator
      [totalElements]="animeSize()"
      [totalPages]="maxPages"
      [currentPage]="currentPage()"
      (pageChange)="page($event)"
    >
      <div filterChild class="h-full md:w-1/2 xl:w-1/3 2xl:w-1/4">
        <app-anime-filters-component></app-anime-filters-component>
      </div>
      <div class="flex flex-col" paginator>
        <mat-paginator
          (page)="pageChanged($event)"
          [length]="animeSize()"
          [pageSize]="10"
          [pageSizeOptions]="[5, 10, 25, 100]"
          aria-label="Select page"
        >
        </mat-paginator>
      </div>
    </app-paginator>

    <ul class="anime-grid">
      @for (anime of animeResult()?.data; track anime.malId) {
        <li class="anime-cell">
          <app-anime-card
            [anime]="anime"
            [expanded]="selectedAnime()?.malId === anime.malId"
            (open)="openAnime($event)"
          >
            <div front>
              <img [src]="anime.imageUrl" [alt]="anime.title" class="anime-poster" />

              <div class="anime-content">
                <div [class]="{ airing: anime.airing }" class="flex items-center">
                  @if (anime.airing) {
                    <mat-icon fontSet="material-symbols-outlined">psychiatry</mat-icon>
                  }
                  <h3 class="anime-title" [innerHTML]="anime.title | titleSplitter"></h3>
                </div>

                <hr />
                #{{ anime.genres }}

                <span class="anime-id"> #{{ anime.malId }} </span>
              </div>
            </div>

            <div back></div>
          </app-anime-card>
        </li>
      }
    </ul>
    <div class="h-46"></div>
  </main>
</div>
